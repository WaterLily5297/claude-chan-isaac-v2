# 每次推送和每个 PR 都自动跑 tools/check.sh。
# PR 页面上出现绿色 ✓ 才合并；红色 ✗ 点进去看是哪一步。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Run checks
        run: bash tools/check.sh
        env:
          LUA: lua5.4
      # Install package: the downloaded artifact unzips to one claude-chan-isaac/
      # folder holding only the files the game loads.
      - name: Build install package
        run: python3 tools/package_mod.py --dir --no-zip --out dist
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: claude-chan-isaac-${{ github.sha }}
          path: dist/
          retention-days: 30
